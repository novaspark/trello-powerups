<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <link rel="stylesheet" href="effort.css" />
    <style>
        html, body { height: 100%; }
        body { overflow: auto; padding: 12px; }
        #container table {
            width: 100%;
            margin: 4px 0 14px 0;
        }
        #container h4 {
            margin: 14px 0 4px 0;
        }
        .muted {
            color: #6b778c;
            font-weight: normal;
        }
    </style>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
    <div class="range-controls">
        <div class="field">
            <label for="from">From</label>
            <input type="date" id="from" />
        </div>
        <div class="field">
            <label for="to">To</label>
            <input type="date" id="to" />
        </div>
        <button id="apply" class="mod-primary">Apply</button>
        <button id="clear">Clear</button>
    </div>
    <div id="container"></div>
    <script src="effort-lib.js"></script>
    <script src="board-report.js"></script>
</body>
</html>
